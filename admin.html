<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo - Studio VT Hair</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div id="telaLogin" class="container-login">
    <div class="logo-container">
      <img src="logo.png" alt="Studio VT Hair Logo" class="logo-gold">
    </div>

    <div class="container">
      <h2 class="texto-dourado-cintilante">🔐 Acesso ao Sistema</h2>
      <form onsubmit="fazerLogin(event)">
        <label>Usuário:</label>
        <input type="text" id="loginUsuario" required>
        
        <label>Senha:</label>
        <input type="password" id="loginSenha" required>
        
        <button type="submit" id="btnConfirmar" style="margin-top: 20px;">Entrar</button>
      </form>
    </div>
  </div>

  <!-- TELA PRINCIPAL ADMIN (INICIA ESCONDIDA) -->
  <div id="telaAdmin" class="container hidden">
    <div class="logo-container">
      <img src="logo.png" alt="Studio VT Hair Logo" class="logo-gold">
    </div>

    <div class="topo-admin">
      <h1 class="texto-dourado-cintilante" style="font-size: 20px;">Painel VT Hair</h1>
      <div class="botoes-topo">
        <button type="button" onclick="abrirModalAgendamentoAdmin()" class="btn-add-user" style="background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%); color: #121216;">+ Agendar Cliente</button>
        <button type="button" onclick="abrirModalBloqueio()" class="btn-add-user" style="background: #dc3545; color: white;">🚫 Bloquear</button>
        <button type="button" onclick="abrirModalCadastro()" class="btn-add-user">+ Add Usuário</button>
        <button type="button" onclick="fazerLogout()" class="btn-sair">Sair</button>
      </div>
    </div>

    <div>
      <label><strong class="texto-dourado-cintilante">Selecione a Data de Consulta:</strong></label>
      <input type="date" id="filtroData">
    </div>

    <h2 class="texto-dourado-cintilante" style="margin-top: 25px; font-size: 18px;">Agendamentos do Dia</h2>
    <div id="listaAgendamentos"></div>

    <h2 class="texto-dourado-cintilante" style="margin-top: 30px; font-size: 18px;">Horários Desmarcados / Cancelados</h2>
    <div id="listaCancelados"></div>
  </div>

  <!-- MODAL DE AGENDAMENTO MANUAL (ADMIN) -->
  <div id="modalAgendamentoAdmin" class="modal-overlay hidden">
    <div class="modal-card" style="max-width: 480px; max-height: 90vh; overflow-y: auto;">
      <h3 class="texto-dourado-cintilante" style="margin-top:0; margin-bottom: 15px; text-align: center;">📅 Agendar Cliente Manualmente</h3>
      <form id="formAgendamentoAdmin" onsubmit="salvarAgendamentoAdmin(event)">
        <label style="margin-top:0;">Nome do Cliente:</label>
        <input type="text" id="adminCliente" required placeholder="Digite o nome completo">

        <label>Telefone / WhatsApp:</label>
        <input type="tel" id="adminTelefone" required placeholder="(16) 99999-9999">

        <label>Serviço Desejado:</label>
        <select id="adminServico" required>
          <option value="">Selecione um serviço...</option>
          <option value="Mechas (4h)">Mechas (4h)</option>
          <option value="Tintura / Coloração (1h20)">Tintura / Coloração (1h20)</option>
          <option value="Plástica dos Fios / Selagem (1h30)">Plástica dos Fios / Selagem (1h30)</option>
          <option value="Corte Feminino (45 min)">Corte Feminino (45 min)</option>
          <option value="Escova / Modelagem (45 min)">Escova / Modelagem (45 min)</option>
          <option value="Tratamento Capilar (1h)">Tratamento Capilar (1h)</option>
        </select>

        <label>Detalhes / Observações:</label>
        <input type="text" id="adminObservacao" placeholder="Ex: Cabelo longo, produto específico">

        <label>Data do Atendimento:</label>
        <input type="date" id="adminData" required>

        <div id="adminSecaoHorarios" class="hidden">
          <label style="margin-top: 15px;">Escolha um Horário Inicial:</label>
          <div id="adminGridHorarios" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px;"></div>
        </div>

        <input type="hidden" id="adminHorarioSelecionado">

        <div style="display:flex; gap: 8px; margin-top: 20px;">
          <button type="submit" id="adminBtnConfirmar" class="btn-add-user" style="flex:1; padding: 10px;" disabled>Confirmar Agendamento</button>
          <button type="button" onclick="fecharModalAgendamentoAdmin()" class="btn-sair" style="flex:1; padding: 10px;">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL DE CADASTRO DE USUÁRIO -->
  <div id="modalCadastro" class="modal-overlay hidden">
    <div class="modal-card">
      <h3 class="texto-dourado-cintilante" style="margin-top:0; margin-bottom: 15px; text-align: center;">👤 Cadastrar Novo Usuário</h3>
      <form onsubmit="cadastrarNovoUsuario(event)">
        <label style="margin-top:0;">Nome Completo:</label>
        <input type="text" id="novoNome" required>
        
        <label>Usuário (Login):</label>
        <input type="text" id="novoUsuario" required>
        
        <label>Senha:</label>
        <input type="password" id="novaSenha" required>
        
        <div style="display:flex; gap: 8px; margin-top: 20px;">
          <button type="submit" class="btn-add-user" style="flex:1; padding: 10px;">Salvar</button>
          <button type="button" onclick="fecharModalCadastro()" class="btn-sair" style="flex:1; padding: 10px;">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL DE BLOQUEIO DE HORÁRIO -->
  <div id="modalBloqueio" class="modal-overlay hidden">
    <div class="modal-card">
      <h3 class="texto-dourado-cintilante" style="margin-top:0; margin-bottom: 15px; text-align: center;">🚫 Bloquear Horário</h3>
      <form onsubmit="bloquearHorario(event)" style="display: flex; flex-direction: column; gap: 12px;">
        <div>
          <label style="display: block; margin-bottom: 4px; text-align: left;">Data:</label>
          <input type="date" id="bloqueioData" required style="width: 100%; box-sizing: border-box;">
        </div>

        <div>
          <button type="button" onclick="selecionarDiaTodo()" style="width: 100%; padding: 10px; background-color: #333342; color: #f1c40f; border: 1px solid #f1c40f; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold;">
            📅 Selecionar Dia Todo (08:00 às 18:00)
          </button>
        </div>

        <div style="display:flex; gap: 10px;">
          <div style="flex: 1;">
            <label style="display: block; margin-bottom: 4px; text-align: left;">Das:</label>
            <select id="bloqueioHoraInicio" required style="width: 100%; box-sizing: border-box;">
              <option value="08:00">08:00</option>
              <option value="09:00">09:00</option>
              <option value="10:00">10:00</option>
              <option value="11:00">11:00</option>
              <option value="13:00">13:00</option>
              <option value="14:00">14:00</option>
              <option value="15:00">15:00</option>
              <option value="16:00">16:00</option>
              <option value="17:00">17:00</option>
              <option value="18:00">18:00</option>
            </select>
          </div>
          
          <div style="flex: 1;">
            <label style="display: block; margin-bottom: 4px; text-align: left;">Até às:</label>
            <select id="bloqueioHoraFim" required style="width: 100%; box-sizing: border-box;">
              <option value="09:00">09:00</option>
              <option value="10:00">10:00</option>
              <option value="11:00">11:00</option>
              <option value="12:00">12:00</option>
              <option value="14:00">14:00</option>
              <option value="15:00">15:00</option>
              <option value="16:00">16:00</option>
              <option value="17:00">17:00</option>
              <option value="18:00">18:00</option>
              <option value="19:00" selected>19:00</option>
            </select>
          </div>
        </div>
        
        <div>
          <label style="display: block; margin-bottom: 4px; text-align: left;">Motivo:</label>
          <input type="text" id="bloqueioMotivo" placeholder="Ex: Folga, Feriado, Almoço" required style="width: 100%; box-sizing: border-box;">
        </div>

        <div style="display:flex; gap: 8px; margin-top: 10px;">
          <button type="submit" class="btn-add-user" style="flex:1; padding: 10px; background: #dc3545; color: white;">Bloquear</button>
          <button type="button" onclick="fecharModalBloqueio()" class="btn-sair" style="flex:1; padding: 10px;">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
