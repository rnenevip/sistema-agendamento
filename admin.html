<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Salão - Administração</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="admin-container">
    <h2>Painel da Profissional 💇‍♀️</h2>
    
    <div class="field-box">
      <label for="filtroData">Selecione a Data de Consulta:</label>
      <input type="date" id="filtroData">
    </div>

    <h3>Agendamentos do Dia</h3>
    <div id="listaAgendamentos">Carregando...</div>

    <hr class="divisor">

    <h3>1. Bloquear Horários (Pausas / Folga)</h3>
    <div class="field-box">
      <label>Data do Bloqueio:</label>
      <input type="date" id="dataBloqueio">
    </div>

    <div class="row-flex">
      <div>
        <label>De:</label>
        <select id="horaInicioBloqueio">
          <option value="08:00">08:00</option>
          <option value="09:00">09:00</option>
          <option value="10:00">10:00</option>
          <option value="11:00">11:00</option>
          <option value="13:00">13:00</option>
          <option value="14:00">14:00</option>
          <option value="15:00">15:00</option>
          <option value="16:00">16:00</option>
          <option value="17:00">17:00</option>
        </select>
      </div>

      <div>
        <label>Até:</label>
        <select id="horaFimBloqueio">
          <option value="09:00">09:00</option>
          <option value="10:00">10:00</option>
          <option value="11:00">11:00</option>
          <option value="12:00">12:00</option>
          <option value="14:00">14:00</option>
          <option value="15:00">15:00</option>
          <option value="16:00">16:00</option>
          <option value="17:00">17:00</option>
          <option value="18:00">18:00</option>
        </select>
      </div>
    </div>

    <button type="button" id="btnBloquearIntervalo" onclick="bloquearHorario()" class="btn btn-red">Bloquear Horário</button>
    <button type="button" id="btnBloquearDiaTodo" class="btn btn-purple">🚫 Bloquear Dia Todo</button>

    <hr class="divisor">

    <h3>2. Agendamento Manual / Futuro</h3>
    
    <div class="field-box">
      <label>Nome do Cliente:</label>
      <input type="text" id="manualCliente" placeholder="Digite o nome completo">
    </div>

    <div class="field-box">
      <label>Telefone / WhatsApp:</label>
      <input type="text" id="manualTelefone" placeholder="(00) 00000-0000">
    </div>

    <div class="field-box">
      <label>Serviço:</label>
      <select id="manualServico">
        <option value="Corte">Corte</option>
        <option value="Escova">Escova</option>
        <option value="Tintura">Tintura</option>
        <option value="Plástica">Plástica</option>
        <option value="Mechas">Mechas</option>
      </select>
    </div>

    <div class="field-box">
      <label>Data:</label>
      <input type="date" id="manualData">
    </div>

    <div class="row-flex">
      <div>
        <label>De:</label>
        <select id="manualHoraInicio">
          <option value="08:00">08:00</option>
          <option value="09:00">09:00</option>
          <option value="10:00">10:00</option>
          <option value="11:00">11:00</option>
          <option value="13:00">13:00</option>
          <option value="14:00">14:00</option>
          <option value="15:00">15:00</option>
          <option value="16:00">16:00</option>
          <option value="17:00">17:00</option>
        </select>
      </div>

      <div>
        <label>Até:</label>
        <select id="manualHoraFim">
          <option value="09:00">09:00</option>
          <option value="10:00">10:00</option>
          <option value="11:00">11:00</option>
          <option value="12:00">12:00</option>
          <option value="14:00">14:00</option>
          <option value="15:00">15:00</option>
          <option value="16:00">16:00</option>
          <option value="17:00">17:00</option>
          <option value="18:00">18:00</option>
        </select>
      </div>
    </div>

    <button type="button" id="btnAgendarManual" onclick="agendarManual()" class="btn btn-green">📅 Agendar Cliente</button>
  </div>

  <script src="admin.js"></script>
</body>
</html>
