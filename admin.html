<h3>2. Agendamento Manual / Futuro</h3>
    <input type="text" id="manualCliente" placeholder="Nome do Cliente">
    <input type="text" id="manualTelefone" placeholder="Telefone / WhatsApp">
    <select id="manualServico">
      <option value="Corte">Corte</option>
      <option value="Escova">Escova</option>
      <option value="Coloração">Coloração</option>
      <option value="Mechas">Mechas</option>
    </select>
    <label>Data:</label>
    <input type="date" id="manualData">

    <div class="bloqueio-form">
      <div>
        <label>De:</label>
        <select id="manualHoraInicio">
          <option value="08:00">08:00</option>
          <option value="09:00">09:00</option>
          <option value="10:00">10:00</option>
          <option value="11:00">11:00</option>
          <option value="13:00">13:00</option>
          <option value="14:00">14:00</option>
          <option value="15:00">15:00</option>
          <option value="16:00">16:00</option>
          <option value="17:00">17:00</option>
        </select>
      </div>

      <div>
        <label>Até:</label>
        <select id="manualHoraFim">
          <option value="09:00">09:00</option>
          <option value="10:00">10:00</option>
          <option value="11:00">11:00</option>
          <option value="12:00">12:00</option>
          <option value="14:00">14:00</option>
          <option value="15:00">15:00</option>
          <option value="16:00">16:00</option>
          <option value="17:00">17:00</option>
          <option value="18:00">18:00</option>
        </select>
      </div>
    </div>
    <button id="btnAgendarManual" style="width: 100%; padding: 10px; background-color: #27ae60; color: white; border: none; border-radius: 6px; font-weight: bold; margin-top: 15px; cursor: pointer;">📅 Agendar Cliente</button>
