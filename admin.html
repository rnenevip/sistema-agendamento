<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Apenas o estilo para ocultar telas e o modal simples */
    .hidden { display: none !important; }
    
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999;
    }
    
    .modal-card {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      width: 90%;
      max-width: 350px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .topo-admin {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .botoes-topo {
      display: flex;
      gap: 8px;
    }

    .btn-add-user {
      background-color: #007bff;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-sair {
      background-color: #6c757d;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div id="telaLogin" class="container">
    <h2>🔐 Acesso ao Sistema</h2>
    <form onsubmit="fazerLogin(event)">
      <div style="margin-bottom: 12px;">
        <label style="display:block; margin-bottom: 4px;">Usuário:</label>
        <input type="text" id="loginUsuario" required style="width: 100%; padding: 8px; box-sizing: border-box;">
      </div>
      <div style="margin-bottom: 16px;">
        <label style="display:block; margin-bottom: 4px;">Senha:</label>
        <input type="password" id="loginSenha" required style="width: 100%; padding: 8px; box-sizing: border-box;">
      </div>
      <button type="submit" class="btn-cancelar" style="background-color: #28a745; width: 100%;">Entrar</button>
    </form>
  </div>

  <!-- TELA PRINCIPAL ADMIN -->
  <div id="telaAdmin" class="container hidden">
    <div class="topo-admin">
      <h1 style="margin: 0;">Painel</h1>
      <div class="botoes-topo">
        <button type="button" onclick="abrirModalCadastro()" class="btn-add-user">+ Add Usuário</button>
        <button type="button" onclick="fazerLogout()" class="btn-sair">Sair</button>
      </div>
    </div>

    <div style="margin-bottom: 20px;">
      <label><strong>Selecione a Data de Consulta:</strong></label>
      <input type="date" id="filtroData" style="width: 100%; padding: 8px; margin-top: 6px; box-sizing: border-box;">
    </div>

    <h2>Agendamentos do Dia</h2>
    <div id="listaAgendamentos"></div>

    <h2 style="margin-top: 30px;">Horários Desmarcados / Cancelados</h2>
    <div id="listaCancelados"></div>
  </div>

  <!-- MODAL DE CADASTRO -->
  <div id="modalCadastro" class="modal-overlay hidden">
    <div class="modal-card">
      <h3 style="margin-top:0;">👤 Cadastrar Novo Usuário</h3>
      <form onsubmit="cadastrarNovoUsuario(event)">
        <div style="margin-bottom: 10px;">
          <label>Nome Completo:</label>
          <input type="text" id="novoNome" required style="width: 100%; padding: 8px; box-sizing: border-box;">
        </div>
        <div style="margin-bottom: 10px;">
          <label>Usuário (Login):</label>
          <input type="text" id="novoUsuario" required style="width: 100%; padding: 8px; box-sizing: border-box;">
        </div>
        <div style="margin-bottom: 15px;">
          <label>Senha:</label>
          <input type="password" id="novaSenha" required style="width: 100%; padding: 8px; box-sizing: border-box;">
        </div>
        <div style="display:flex; gap: 8px;">
          <button type="submit" class="btn-add-user" style="flex:1;">Salvar</button>
          <button type="button" onclick="fecharModalCadastro()" class="btn-sair" style="flex:1;">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
