<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
    .card { background: white; padding: 20px; border-radius: 8px; max-width: 500px; margin: 40px auto; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .hidden { display: none !important; }
    input, button, select { width: 100%; padding: 10px; margin-top: 8px; margin-bottom: 12px; box-sizing: border-box; }
    button { background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button.btn-red { background-color: #dc3545; }
    button.btn-blue { background-color: #007bff; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div id="telaLogin" class="card">
    <h2>🔐 Acesso ao Sistema</h2>
    <form onsubmit="fazerLogin(event)">
      <label>Usuário:</label>
      <input type="text" id="loginUsuario" required>
      <label>Senha:</label>
      <input type="password" id="loginSenha" required>
      <button type="submit">Entrar</button>
    </form>
  </div>

  <!-- TELA PRINCIPAL ADMIN -->
  <div id="telaAdmin" class="hidden">
    <div class="header-bar">
      <h2>Painel Administrativo</h2>
      <div>
        <button type="button" onclick="abrirModalCadastro()" class="btn-blue" style="width: auto; margin-right: 10px;">➕ Add Usuário</button>
        <button type="button" onclick="fazerLogout()" class="btn-red" style="width: auto;">Sair</button>
      </div>
    </div>

    <div>
      <label><strong>Selecione a Data de Consulta:</strong></label>
      <input type="date" id="filtroData">
    </div>

    <h3>Agendamentos do Dia</h3>
    <div id="listaAgendamentos"></div>

    <h3>Horários Desmarcados / Cancelados</h3>
    <div id="listaCancelados"></div>
  </div>

  <!-- MODAL PARA CADASTRAR NOVO USUÁRIO -->
  <div id="modalCadastro" class="modal hidden">
    <div class="card" style="margin: 0; width: 90%;">
      <h3>👤 Cadastrar Novo Usuário</h3>
      <form onsubmit="cadastrarNovoUsuario(event)">
        <label>Nome Completo:</label>
        <input type="text" id="novoNome" required>
        <label>Usuário (Login):</label>
        <input type="text" id="novoUsuario" required>
        <label>Senha:</label>
        <input type="password" id="novaSenha" required>
        <button type="submit">Salvar Usuário</button>
        <button type="button" onclick="fecharModalCadastro()" class="btn-red">Cancelar</button>
      </form>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
